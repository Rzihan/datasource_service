services:
  mysql:
    # 镜像名可覆盖：访问不到 docker.io 时，在 .env 里配加速源地址
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: dataset-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_please_change
      MYSQL_DATABASE: dataset_service
      MYSQL_USER: dataset
      MYSQL_PASSWORD: dataset_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # app 依赖这个探针，避免 MySQL 还没就绪时服务就启动，省掉一堆连接重试
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_pass_please_change']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  clickhouse:
    # 查询执行引擎。8123 是 HTTP 端口，浏览器打开 http://localhost:8123/play
    # 就是 ClickHouse 自带的 Web 控制台，可以直接写 SQL 看数据。
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:24.8}
    container_name: dataset-clickhouse
    environment:
      CLICKHOUSE_DB: demo
      CLICKHOUSE_USER: dataset
      CLICKHOUSE_PASSWORD: ch_pass
      # 允许 init.sql 创建只读账号
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --query "SELECT 1" >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 基础镜像默认取官方地址；本机 docker.io 拉不到时，在 .env 里改成加速源
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-docker.1ms.run/library/golang:1.26-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-docker.1ms.run/library/alpine:3.21}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: dataset-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HTTP_PORT: 8080
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dataset
      DB_PASSWORD: dataset_pass
      DB_NAME: dataset_service
      DB_MAX_OPEN: 50
      DB_MAX_IDLE: 10
      # mid_sql 软上限（字节），防误操作把存储撑爆
      MAX_SQL_BYTES: 1048576
      # 表结构由 init.sql 建好；本地想让 GORM 自动对齐表结构时改成 true
      DB_AUTO_MIGRATE: 'false'
      # ---- ClickHouse：用 init.sql 里建的只读账号 reader ----
      CH_HOST: clickhouse
      CH_PORT: 9000
      CH_USER: reader
      CH_PASSWORD: reader_pass
      CH_DB: demo
      QUERY_TIMEOUT_SECONDS: 30
      QUERY_MAX_ROWS: 10000
      QUERY_DEFAULT_LIMIT: 1000
      QUERY_MAX_CONCURRENCY: 8
      QUERY_DIM_VALUE_LIMIT: 1000
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  mysql-data:
  ch-data:
